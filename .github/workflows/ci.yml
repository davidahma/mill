name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full native gate
        env:
          MILL_PORTABLE_RECEIPT_PYTHON: python3
        run: npm run check
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Starter production dependency audit
        run:
          npm --prefix recipes/node-typescript-next-web audit --omit=dev
          --audit-level=high
      - name: Structural audit of this checkout
        run: node dist/cli.js --json --cwd . audit

  oci:
    name: ${{ matrix.profile }}-oci
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        profile: [pnpm, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build Mill
        run: npm run build
      - name: Run pinned CPU OCI fixture
        run: node scripts/qualify-${{ matrix.profile }}-oci.mjs
